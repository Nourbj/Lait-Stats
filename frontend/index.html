<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LaitTrack — Suivi des paquets de lait</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0E1420;
    --bg2:       #151C2C;
    --bg3:       #1C2540;
    --surface:   #1E2A42;
    --border:    #2A3654;
    --teal:      #0ECEC8;
    --teal-dim:  rgba(14,206,200,.12);
    --teal-glow: rgba(14,206,200,.25);
    --amber:     #F59E0B;
    --red:       #EF4444;
    --green:     #22C55E;
    --text:      #E8EDF5;
    --muted:     #6B7FA3;
    --radius:    14px;
    --shadow:    0 4px 24px rgba(0,0,0,.45);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Animated bg grid ── */
  body::before {
    content:'';
    position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(rgba(14,206,200,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(14,206,200,.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events:none;
  }

  /* ── Layout ── */
  #root { position:relative; z-index:1; }

  .app-shell {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: rgba(21,28,44,.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 1.15rem; font-weight: 700; letter-spacing: -.02em;
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--teal), #0B9B96);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .logo span { color: var(--teal); }
  .header-badge {
    font-size: .72rem; font-weight: 600; color: var(--teal);
    background: var(--teal-dim); border: 1px solid var(--teal-glow);
    padding: 3px 10px; border-radius: 20px;
    letter-spacing: .04em; text-transform: uppercase;
  }

  /* ── Main ── */
  main {
    flex: 1;
    padding: 40px 32px;
    max-width: 1300px;
    margin: 0 auto;
    width: 100%;
  }

  /* ── Upload zone ── */
  .upload-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 80px 20px;
  }
  .upload-eyebrow {
    font-size: .75rem; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; color: var(--teal); margin-bottom: 20px;
  }
  .upload-headline {
    font-size: 2.6rem; font-weight: 800; letter-spacing: -.04em;
    text-align: center; line-height: 1.1; margin-bottom: 12px;
    background: linear-gradient(135deg, var(--text) 40%, var(--muted));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .upload-sub {
    color: var(--muted); text-align: center; font-size: .95rem;
    margin-bottom: 48px; max-width: 480px; line-height: 1.6;
  }

  .drop-zone {
    width: 480px; max-width: 100%;
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 48px 32px;
    text-align: center;
    cursor: pointer;
    transition: all .25s ease;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }
  .drop-zone::before {
    content:''; position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 0%, var(--teal-dim), transparent 70%);
    opacity: 0; transition: opacity .3s;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--teal);
    transform: translateY(-2px);
    box-shadow: 0 0 0 4px var(--teal-glow), var(--shadow);
  }
  .drop-zone:hover::before, .drop-zone.drag-over::before { opacity: 1; }

  .drop-icon {
    font-size: 3rem; margin-bottom: 16px; display: block;
    filter: drop-shadow(0 0 12px var(--teal));
  }
  .drop-title { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
  .drop-sub { font-size: .83rem; color: var(--muted); }
  .drop-formats {
    margin-top: 16px; font-size: .75rem; color: var(--muted);
    display: flex; justify-content: center; gap: 8px;
  }
  .fmt-badge {
    background: var(--bg3); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 4px; font-weight: 600;
  }
  input[type=file] { display:none; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 28px; border-radius: 10px;
    font-family: inherit; font-size: .9rem; font-weight: 600;
    cursor: pointer; border: none; transition: all .2s;
    text-decoration: none;
  }
  .btn-primary {
    background: var(--teal);
    color: #0E1420;
    box-shadow: 0 0 0 0 var(--teal-glow);
  }
  .btn-primary:hover {
    background: #0BD6D0;
    transform: translateY(-1px);
    box-shadow: 0 0 0 6px var(--teal-glow);
  }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-outline {
    background: transparent; color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-outline:hover { border-color: var(--teal); color: var(--teal); }

  /* ── Loading ── */
  .loading-overlay {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px; padding: 80px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 3px solid var(--border);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--muted); font-size: .9rem; }

  /* ── Dashboard ── */
  .dashboard { animation: fadeUp .4s ease; }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .dash-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 32px; flex-wrap: wrap; gap: 16px;
  }
  .dash-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -.03em; }
  .dash-meta { font-size: .82rem; color: var(--muted); margin-top: 4px; }
  .dash-actions { display: flex; gap: 10px; }

  /* ── KPI cards ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  @media(max-width:900px) { .kpi-grid { grid-template-columns: repeat(2,1fr); } }

  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    position: relative; overflow: hidden;
    transition: transform .2s, box-shadow .2s;
  }
  .kpi-card:hover { transform:translateY(-2px); box-shadow: var(--shadow); }
  .kpi-card::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(255,255,255,.02), transparent);
    pointer-events:none;
  }
  .kpi-label { font-size: .72rem; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .kpi-value { font-size: 2rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .kpi-value.teal { color: var(--teal); }
  .kpi-value.amber { color: var(--amber); }
  .kpi-value.green { color: var(--green); }
  .kpi-sub { font-size: .78rem; color: var(--muted); margin-top: 6px; }
  .kpi-accent {
    position: absolute; top: 0; right: 0;
    width: 80px; height: 80px;
    border-radius: 0 var(--radius) 0 80px;
    opacity: .07;
  }
  .kpi-accent.teal { background: var(--teal); }
  .kpi-accent.amber { background: var(--amber); }
  .kpi-accent.green { background: var(--green); }
  .kpi-accent.red   { background: var(--red); opacity:.06; }

  /* ── Section title ── */
  .section-title {
    font-size: .72rem; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }
  .section-title::after {
    content:''; flex:1; height:1px; background:var(--border);
  }

  /* ── Two-col layout ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media(max-width:900px) { .two-col { grid-template-columns: 1fr; } }

  /* ── Panel ── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    overflow: hidden;
  }
  .panel-title {
    font-size: .85rem; font-weight: 600; color: var(--text);
    margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
  }

  /* ── Bar chart ── */
  .bar-chart { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-name {
    width: 130px; flex-shrink: 0;
    font-size: .82rem; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bar-track {
    flex: 1; height: 20px; background: var(--bg3);
    border-radius: 4px; overflow: hidden; position: relative;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--teal), #0BD6D0);
    border-radius: 4px;
    transition: width .6s cubic-bezier(.22,.68,0,1.2);
    position: relative;
  }
  .bar-fill::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(90deg, transparent 60%, rgba(255,255,255,.12));
  }
  .bar-val {
    width: 36px; text-align: right;
    font-size: .82rem; font-weight: 700; color: var(--teal);
  }

  /* ── Donut mini ── */
  .donut-row { display: flex; align-items: center; gap: 20px; justify-content: center; padding: 10px; }
  .donut-wrap { position: relative; width: 120px; height: 120px; flex-shrink: 0; }
  .donut-wrap svg { transform: rotate(-90deg); }
  .donut-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .donut-pct { font-size: 1.4rem; font-weight: 800; color: var(--teal); }
  .donut-lbl { font-size: .65rem; color: var(--muted); font-weight: 600; }
  .donut-legend { display: flex; flex-direction: column; gap: 10px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: .82rem; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* ── Heatmap ── */
  .heatmap-wrap { overflow-x: auto; }
  .heatmap-table {
    border-collapse: collapse;
    font-size: .75rem;
    min-width: 100%;
  }
  .heatmap-table th {
    padding: 4px 6px; text-align: center;
    color: var(--muted); font-weight: 600;
    white-space: nowrap;
  }
  .heatmap-table th.emp-col { text-align: left; min-width: 120px; padding-right: 12px; }
  .heatmap-table td {
    padding: 3px 2px; text-align: center;
  }
  .heatmap-table td.emp-name {
    text-align: left; padding-right: 12px;
    font-weight: 500; font-size: .78rem; white-space: nowrap;
  }
  .heat-cell {
    width: 22px; height: 22px; border-radius: 4px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: .65rem; font-weight: 700;
    margin: 1px;
    transition: transform .15s;
    cursor: default;
  }
  .heat-cell:hover { transform: scale(1.3); z-index: 10; position: relative; }
  .heat-1 { background: #0EA5A0; color: #fff; }
  .heat-0 { background: var(--bg3); color: var(--muted); }
  .heat-total {
    font-weight: 700; font-size: .82rem; color: var(--teal);
    padding-left: 10px !important;
  }

  /* ── Employee table ── */
  .emp-table { width: 100%; border-collapse: collapse; }
  .emp-table th {
    padding: 10px 14px; text-align: left;
    font-size: .72rem; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .emp-table th:not(:first-child) { text-align: center; }
  .emp-table td {
    padding: 12px 14px;
    font-size: .85rem;
    border-bottom: 1px solid rgba(42,54,84,.5);
  }
  .emp-table td:not(:first-child) { text-align: center; }
  .emp-table tr:last-child td { border-bottom: none; }
  .emp-table tr:hover td { background: rgba(255,255,255,.02); }
  .emp-table .rank { color: var(--muted); font-size: .75rem; }
  .emp-table .emp-name-cell { font-weight: 600; }
  .pct-bar-wrap { display: flex; align-items: center; gap: 8px; justify-content: center; }
  .pct-bar-mini { height: 6px; border-radius: 3px; background: var(--teal); min-width: 4px; }
  .pct-text { font-size: .82rem; font-weight: 600; color: var(--teal); width: 40px; text-align: right; }

  /* ── Footer ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 20px 32px;
    text-align: center;
    font-size: .78rem; color: var(--muted);
    background: rgba(21,28,44,.5);
  }

  /* ── Toast ── */
  .toast-container {
    position: fixed; bottom: 24px; right: 24px; z-index: 999;
    display: flex; flex-direction: column; gap: 10px;
  }
  .toast {
    background: var(--surface); border: 1px solid var(--border);
    padding: 12px 18px; border-radius: 10px;
    font-size: .85rem; font-weight: 500;
    display: flex; align-items: center; gap: 10px;
    box-shadow: var(--shadow);
    animation: toastIn .3s ease;
  }
  @keyframes toastIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:none; } }
  .toast.success { border-left: 3px solid var(--green); }
  .toast.error   { border-left: 3px solid var(--red); }

  /* ── Error ── */
  .error-box {
    background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.3);
    border-radius: var(--radius); padding: 20px 24px;
    display: flex; align-items: center; gap: 14px;
    font-size: .9rem; color: #FCA5A5; max-width: 560px; margin: 40px auto;
  }
  .error-icon { font-size: 1.5rem; }

  /* ── Reset btn ── */
  .chip-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg3); border: 1px solid var(--border);
    padding: 4px 12px; border-radius: 20px;
    font-size: .78rem; font-weight: 600; color: var(--muted);
  }
  .chip-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
const API = 'http://localhost:5000/api';

// ── State ──────────────────────────────────────────────────────────────────
let state = {
  view: 'upload',  // 'upload' | 'loading' | 'dashboard' | 'error'
  data: null,
  file: null,
  toasts: [],
  downloading: false,
  error: null
};

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="app-shell">
      ${Header()}
      <main>
        ${state.view === 'upload'     ? Upload()    : ''}
        ${state.view === 'loading'    ? Loading()   : ''}
        ${state.view === 'dashboard'  ? Dashboard() : ''}
        ${state.view === 'error'      ? Error()     : ''}
      </main>
      ${Footer()}
    </div>
    ${Toasts()}
  `;
  attachEvents();
}

// ── Components ─────────────────────────────────────────────────────────────
function Header() {
  return `<header>
    <div class="logo">
      <div class="logo-icon">🥛</div>
      Lait<span>Track</span>
    </div>
    ${state.view === 'dashboard' ? `
      <div class="chip-badge">
        <span class="dot"></span>
        ${state.data.nb_employees} employés · ${state.data.nb_dates} jours
      </div>
      <button class="btn btn-outline" id="btn-reset">← Nouveau fichier</button>
    ` : '<div class="header-badge">v1.0</div>'}
  </header>`;
}

function Upload() {
  return `<div class="upload-section">
    <div class="upload-eyebrow">Gestion automatisée</div>
    <h1 class="upload-headline">Suivi des paquets<br>de lait par employé</h1>
    <p class="upload-sub">Importez votre fichier Excel — obtenez instantanément un tableau de bord complet et un rapport téléchargeable.</p>

    <div class="drop-zone" id="drop-zone">
      <span class="drop-icon">📊</span>
      <div class="drop-title">Glissez votre fichier Excel ici</div>
      <div class="drop-sub">ou cliquez pour sélectionner</div>
      <div class="drop-formats">
        <span class="fmt-badge">.xlsx</span>
        <span class="fmt-badge">.xls</span>
      </div>
      <input type="file" id="file-input" accept=".xlsx,.xls" />
    </div>

    <div style="margin-top:32px; color:var(--muted); font-size:.82rem; text-align:center;">
      <strong style="color:var(--text)">Format attendu :</strong>
      colonne A = noms · colonnes suivantes = dates · valeurs 0 ou 1
    </div>
  </div>`;
}

function Loading() {
  return `<div class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Analyse du fichier en cours…</div>
  </div>`;
}

function Dashboard() {
  const d = state.data;
  const top = d.employees[0];
  const bottom = d.employees[d.employees.length - 1];

  return `<div class="dashboard">
    <div class="dash-header">
      <div>
        <div class="dash-title">Tableau de bord — Suivi du lait</div>
        <div class="dash-meta">Fichier : ${state.file?.name || '—'} · Analysé le ${new Date().toLocaleDateString('fr-FR')}</div>
      </div>
      <div class="dash-actions">
        <button class="btn btn-outline" id="btn-reset">← Retour</button>
        <button class="btn btn-primary" id="btn-download" ${state.downloading ? 'disabled' : ''}>
          ${state.downloading ? '<span style="display:inline-block;width:14px;height:14px;border:2px solid #0E1420;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite"></span> Génération…' : '⬇ Télécharger Excel'}
        </button>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-accent teal"></div>
        <div class="kpi-label">Total paquets pris</div>
        <div class="kpi-value teal">${d.total_global}</div>
        <div class="kpi-sub">sur ${d.nb_employees * d.nb_dates} possibles</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-accent green"></div>
        <div class="kpi-label">Taux global</div>
        <div class="kpi-value green">${d.taux_global}%</div>
        <div class="kpi-sub">de jours avec lait</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-accent amber"></div>
        <div class="kpi-label">Top employé</div>
        <div class="kpi-value amber" style="font-size:1.2rem;letter-spacing:-.02em;">${top.nom.split(' ')[0]}</div>
        <div class="kpi-sub">${top.total} paquet${top.total>1?'s':''} · ${top.taux}%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-accent red"></div>
        <div class="kpi-label">Nb employés</div>
        <div class="kpi-value" style="color:var(--text)">${d.nb_employees}</div>
        <div class="kpi-sub">sur ${d.nb_dates} jours analysés</div>
      </div>
    </div>

    <div class="two-col">
      ${BarPanel()}
      ${DonutPanel()}
    </div>

    <div class="section-title" style="margin-bottom:16px;">Carte de chaleur des présences</div>
    <div class="panel" style="margin-bottom:20px;">
      ${HeatmapPanel()}
    </div>

    <div class="section-title" style="margin-bottom:16px;">Classement détaillé</div>
    <div class="panel">
      ${EmployeeTable()}
    </div>
  </div>`;
}

function BarPanel() {
  const d = state.data;
  const max = Math.max(...d.employees.map(e => e.total));
  return `<div>
    <div class="section-title">Paquets par employé</div>
    <div class="panel">
      <div class="bar-chart">
        ${d.employees.map(e => `
          <div class="bar-row">
            <div class="bar-name" title="${e.nom}">${e.nom.split(' ')[0]} ${e.nom.split(' ')[1]?.[0]||''}.</div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${max>0?(e.total/max*100):0}%"></div>
            </div>
            <div class="bar-val">${e.total}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function DonutPanel() {
  const d = state.data;
  const pct = d.taux_global;
  const r = 46, cx = 60, cy = 60;
  const circ = 2 * Math.PI * r;
  const taken = circ * (pct / 100);
  const rest = circ - taken;

  // Distribution of days
  const allTaken = d.total_global;
  const allMissed = (d.nb_employees * d.nb_dates) - allTaken;

  return `<div>
    <div class="section-title">Répartition globale</div>
    <div class="panel" style="display:flex;align-items:center;justify-content:center;padding:30px;">
      <div class="donut-row">
        <div class="donut-wrap">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bg3)" stroke-width="14"/>
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--teal)" stroke-width="14"
              stroke-dasharray="${taken} ${rest}" stroke-linecap="round"/>
          </svg>
          <div class="donut-center">
            <div class="donut-pct">${pct}%</div>
            <div class="donut-lbl">GLOBAL</div>
          </div>
        </div>
        <div class="donut-legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--teal)"></div><span><strong>${allTaken}</strong> pris</span></div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--bg3)"></div><span><strong>${allMissed}</strong> non pris</span></div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--amber)"></div><span><strong>${d.nb_dates}</strong> jours/pers.</span></div>
        </div>
      </div>
    </div>
  </div>`;
}

function HeatmapPanel() {
  const d = state.data;
  const dates = d.dates;
  return `<div class="heatmap-wrap">
    <table class="heatmap-table">
      <thead>
        <tr>
          <th class="emp-col">Employé</th>
          ${dates.map(dt => `<th>${dt}</th>`).join('')}
          <th style="color:var(--teal);padding-left:10px">Total</th>
        </tr>
      </thead>
      <tbody>
        ${d.employees.map(e => `
          <tr>
            <td class="emp-name">${e.nom}</td>
            ${e.valeurs.map(v => `<td><div class="heat-cell heat-${v}">${v||''}</div></td>`).join('')}
            <td class="heat-total">${e.total}</td>
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

function EmployeeTable() {
  const d = state.data;
  return `<table class="emp-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Employé</th>
        <th>Paquets pris</th>
        <th>Jours manqués</th>
        <th>Taux</th>
      </tr>
    </thead>
    <tbody>
      ${d.employees.map((e, i) => `
        <tr>
          <td class="rank">${i + 1}</td>
          <td class="emp-name-cell">${e.nom}</td>
          <td><strong style="color:var(--teal)">${e.total}</strong></td>
          <td style="color:var(--muted)">${e.sans}</td>
          <td>
            <div class="pct-bar-wrap">
              <div class="pct-bar-mini" style="width:${Math.max(e.taux * .6, 4)}px"></div>
              <div class="pct-text">${e.taux}%</div>
            </div>
          </td>
        </tr>`).join('')}
    </tbody>
  </table>`;
}

function Error() {
  return `<div class="error-box">
    <div class="error-icon">⚠️</div>
    <div>
      <strong>Erreur lors du traitement</strong><br>
      <span style="opacity:.8">${state.error}</span><br><br>
      <button class="btn btn-outline" id="btn-reset" style="font-size:.82rem;padding:8px 16px;">Réessayer</button>
    </div>
  </div>`;
}

function Toasts() {
  return `<div class="toast-container">
    ${state.toasts.map(t => `
      <div class="toast ${t.type}">
        <span>${t.type === 'success' ? '✅' : '❌'}</span>
        ${t.msg}
      </div>`).join('')}
  </div>`;
}

function Footer() {
  return `<footer>LaitTrack — Suivi automatisé des paquets de lait · Développé avec Flask & openpyxl</footer>`;
}

// ── Events ─────────────────────────────────────────────────────────────────
function attachEvents() {
  document.getElementById('btn-reset')?.addEventListener('click', () => {
    state = { view:'upload', data:null, file:null, toasts:[], downloading:false, error:null };
    render();
  });

  document.getElementById('btn-download')?.addEventListener('click', downloadReport);

  const dz = document.getElementById('drop-zone');
  const fi = document.getElementById('file-input');
  if (!dz || !fi) return;

  dz.addEventListener('click', () => fi.click());
  fi.addEventListener('change', e => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  });
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
}

async function handleFile(file) {
  if (!file.name.match(/\.xlsx?$/i)) {
    toast('Veuillez sélectionner un fichier .xlsx ou .xls', 'error'); return;
  }
  state.file = file;
  state.view = 'loading';
  render();

  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await fetch(`${API}/preview`, { method:'POST', body:fd });
    if (!res.ok) { const e = await res.json(); throw new Error(e.error || 'Erreur serveur'); }
    state.data = await res.json();
    state.view = 'dashboard';
  } catch(e) {
    state.error = e.message;
    state.view = 'error';
  }
  render();
}

async function downloadReport() {
  state.downloading = true; render();
  const fd = new FormData();
  fd.append('file', state.file);
  try {
    const res = await fetch(`${API}/download`, { method:'POST', body:fd });
    if (!res.ok) throw new Error('Erreur génération');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'), { href:url, download:`rapport_lait_${Date.now()}.xlsx` });
    a.click(); URL.revokeObjectURL(url);
    toast('Rapport téléchargé avec succès !', 'success');
  } catch(e) {
    toast('Erreur : ' + e.message, 'error');
  }
  state.downloading = false; render();
}

function toast(msg, type='success') {
  const t = { msg, type, id: Date.now() };
  state.toasts.push(t);
  render();
  setTimeout(() => {
    state.toasts = state.toasts.filter(x => x.id !== t.id);
    render();
  }, 4000);
}

// ── Boot ───────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
